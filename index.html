<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Pocket Python</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#1e1e1e">
<style>
:root{color-scheme:dark;--bg:#1e1e1e;--bar:#252526;--fg:#d4d4d4;--ac:#0e639c;--fs:14px;--lh:21px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:#3a3d41;border:0;border-radius:8px;padding:0 12px;height:40px;min-width:40px;cursor:pointer}
header{display:flex;gap:6px;align-items:center;padding:8px;background:var(--bar)}
#nm{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;font-weight:600}
#run{background:#2ea043}#stop{background:#d13438;display:none}
#ed{position:relative;flex:1;min-height:0;display:flex}
#gut,#hl,#ta{font:var(--fs)/var(--lh) ui-monospace,Menlo,Consolas,monospace;letter-spacing:0}
#gut{width:44px;padding:10px 8px 10px 0;text-align:right;color:#6e7681;overflow:hidden;white-space:pre;user-select:none}
#cw{position:relative;flex:1;min-width:0}
#hl,#ta{position:absolute;inset:0;margin:0;padding:10px;border:0;white-space:pre;tab-size:4}
#hl{pointer-events:none;overflow:hidden;color:var(--fg)}
#ta{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#fff;resize:none;outline:0;overflow:auto}
#hl i{font-style:normal}.c{color:#6a9955}.s{color:#ce9178}.n{color:#b5cea8}.f{color:#dcdcaa}.k1{color:#c586c0}.k2{color:#569cd6}.t{color:#4ec9b0}.v{color:#9cdcfe}
.bar{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:var(--bar)}
.bar button{flex:none;height:36px;font-family:ui-monospace,monospace}
#sg{display:none}#sg button{background:#094771}
#op{height:36%;display:flex;flex-direction:column;border-top:2px solid var(--ac);background:#181818}
#oh{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:13px;color:#9da5b4}#oh span{flex:1}
#oh button{height:28px;font-size:13px}
#out{flex:1;margin:0;padding:6px 10px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.e{color:#f48771}
#ov{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:5}#ov.show{display:flex}
#sheet{width:100%;max-height:85%;overflow:auto;background:var(--bar);border-radius:16px 16px 0 0;padding:16px 12px calc(16px + env(safe-area-inset-bottom));border-top:3px solid var(--ac)}
#sheet h2{margin:0 0 10px;font-size:18px}
.row{display:flex;gap:8px;margin-bottom:8px}.row button{flex:1}.row .nm{flex:3;text-align:left;background:#2d2d30;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .nm.on{outline:2px solid var(--ac)}
#sheet input[type=text]{width:100%;height:44px;font:16px system-ui,sans-serif;background:#1e1e1e;color:var(--fg);border:1px solid #555;border-radius:8px;padding:0 10px;margin-bottom:10px}
.cap{font-size:13px;color:#9da5b4;margin:0 0 10px}
</style></head><body>
<header><button id="nm"></button><button id="un">Undo</button><button id="re">Redo</button><button id="run">&#9654; Run</button><button id="stop">&#9632; Stop</button></header>
<div id="ed"><div id="gut"></div><div id="cw"><pre id="hl" aria-hidden="true"></pre><textarea id="ta" wrap="off" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Code editor"></textarea></div></div>
<div class="bar" id="sg"></div><div class="bar" id="sy"></div>
<div id="op"><div id="oh">Output <span id="st"></span><button id="clr">Clear</button></div><pre id="out"></pre></div>
<div id="ov"><div id="sheet"></div></div><input type="file" id="imp" accept=".py,.txt" hidden>
<script>
/*HL*/
const KW1=new Set('if elif else for while try except finally with return yield raise import from as break continue pass assert del global nonlocal async await match case'.split(' '));
const KW2=new Set('def class lambda and or not in is None True False'.split(' '));
const TY=new Set('int str float bool list dict set tuple object bytes type complex frozenset range Exception ValueError TypeError KeyError IndexError'.split(' '));
const BI=new Set('print len input open sorted sum min max abs round enumerate zip map filter any all isinstance reversed id hash chr ord format repr iter next dir vars getattr setattr hasattr callable eval exec bin hex oct pow divmod'.split(' '));
const RE=/(#[^\n]*)|((?:[rRbBfFuU]{1,2})?(?:"""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?))|(\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?\b)|(@[A-Za-z_][\w.]*)|([A-Za-z_]\w*)/g;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hi(src){let o='',i=0,m,prev='';RE.lastIndex=0;
 while((m=RE.exec(src))){o+=esc(src.slice(i,m.index));i=RE.lastIndex;const t=m[0];let c;
  if(m[1])c='c';else if(m[2])c='s';else if(m[3])c='n';else if(m[4])c='f';
  else{const call=/^\s*\(/.test(src.slice(i,i+40));
   if(prev==='def')c='f';else if(prev==='class')c='t';
   else if(KW1.has(t))c='k1';else if(KW2.has(t))c='k2';else if(TY.has(t))c='t';else if(call||BI.has(t))c='f';else c='v';prev=t}
  o+='<i class="'+c+'">'+esc(t)+'</i>'}
 return o+esc(src.slice(i))+'\n'}
/*ENDHL*/
const $=id=>document.getElementById(id);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k in e)e[k]=v;else e.setAttribute(k,v)}c.flat().forEach(x=>x!=null&&e.append(x));return e};
const ta=$('ta'),hl=$('hl'),gut=$('gut'),out=$('out'),K='pypocket-v1';
const mk=(name,code='')=>({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,code});
let S={files:[{id:'a1',name:'main.py',code:'name = "Akira"\nfor i in range(3):\n    print(f"Hello, {name} {i}")\n'}],cur:'a1',fs:14};
try{const r=JSON.parse(localStorage.getItem(K));if(r&&r.files&&r.files.length)S=r}catch(e){}
const cur=()=>S.files.find(f=>f.id===S.cur)||S.files[0];
let st;const save=()=>{clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},300)};
function sync(){hl.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft;gut.scrollTop=ta.scrollTop}
function paint(){const v=ta.value;hl.innerHTML=hi(v);gut.textContent=Array.from({length:v.split('\n').length},(_,i)=>i+1).join('\n');sync()}
function fs(){const r=document.documentElement.style;r.setProperty('--fs',S.fs+'px');r.setProperty('--lh',Math.round(S.fs*1.5)+'px')}
function load(){ta.value=cur().code;$('nm').textContent=cur().name+' \u25BE';paint();S.cur=cur().id}
let busy=false;const put=t=>{busy=true;document.execCommand('insertText',false,t);busy=false};
const ins=t=>{ta.focus();put(t)};
function suggest(){const p=ta.selectionStart,v=ta.value,m=/[A-Za-z_]\w*$/.exec(v.slice(0,p)),sg=$('sg');sg.replaceChildren();
 if(!m||m[0].length<2||ta.selectionEnd!==p){sg.style.display='none';return}
 const w=m[0],set=new Set([...KW1,...KW2,...BI,...TY,...(v.match(/[A-Za-z_]\w{2,}/g)||[])]);
 const r=[...set].filter(x=>x!==w&&x.startsWith(w)).sort((a,b)=>a.length-b.length).slice(0,8);
 sg.style.display=r.length?'flex':'none';r.forEach(x=>sg.append(bt(x,()=>{ta.focus();ta.setSelectionRange(p-w.length,p);put(x)})))}
const bt=(l,f)=>h('button',{textContent:l,onmousedown:e=>e.preventDefault(),onclick:f});
const CL={'(':')','[':']','{':'}','"':'"',"'":"'"};
function sym(s){ta.focus();const p=ta.selectionStart,v=ta.value;
 if(')]}"\''.includes(s)&&v[p]===s&&ta.selectionEnd===p){ta.setSelectionRange(p+1,p+1);return}
 if(CL[s]&&ta.selectionEnd===p){put(s+CL[s]);ta.setSelectionRange(p+1,p+1)}else put(s)}
ta.addEventListener('input',e=>{
 if(!busy&&/^insert(LineBreak|Paragraph|Text|CompositionText)$/.test(e.inputType||'')&&ta.selectionStart===ta.selectionEnd){
  const p=ta.selectionStart,v=ta.value,ch=v[p-1],nx=v[p],pv=v[p-2]||'';
  if(ch==='\n'){const line=v.slice(v.lastIndexOf('\n',p-2)+1,p-1),ind=/^[ \t]*/.exec(line)[0]+(/:\s*$/.test(line)?'    ':'');if(ind)put(ind)}
  else if(')]}"\''.includes(ch)&&nx===ch){busy=true;document.execCommand('forwardDelete');busy=false}
  else if(CL[ch]&&!(/["']/.test(ch)&&/\w/.test(pv))&&!(nx&&/\w/.test(nx))){put(CL[ch]);ta.setSelectionRange(p,p)}}
 cur().code=ta.value;save();paint();suggest()});
ta.addEventListener('scroll',sync);ta.addEventListener('click',suggest);
ta.addEventListener('focus',()=>$('op').style.display='none');
ta.addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==ta){$('op').style.display='';$('sg').style.display='none'}},150));
['Tab',':','(',')','[',']','{','}','"',"'",'=','#','_','.',',','+','-','*','/','<','>'].forEach((s,i)=>$('sy').append(bt(s,()=>sym(i?s:'    '))));
$('un').onmousedown=$('re').onmousedown=e=>e.preventDefault();
$('un').onclick=()=>{ta.focus();document.execCommand('undo')};$('re').onclick=()=>{ta.focus();document.execCommand('redo')};
/* engine */
const WSRC=`importScripts('https://cdn.jsdelivr.net/npm/pyodide@0.26.4/pyodide.js');
let py,fl,u8;
function ask(p){if(!fl)throw new Error('input() needs the installed app (cross-origin isolation is off here).');
postMessage({t:'in',p:String(p)});Atomics.store(fl,0,0);Atomics.wait(fl,0,0);const n=fl[1];return new TextDecoder().decode(u8.slice(8,8+n))}
async function boot(){py=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/npm/pyodide@0.26.4/'});
py.setStdout({batched:s=>postMessage({t:'o',s:s+'\\n'})});py.setStderr({batched:s=>postMessage({t:'e',s:s+'\\n'})});
py.globals.set('__ask',ask);py.runPython('import builtins\\nbuiltins.input=lambda p="":__ask(p)');postMessage({t:'ready'})}
onmessage=async e=>{const m=e.data;
if(m.t==='init'){if(m.sab){fl=new Int32Array(m.sab);u8=new Uint8Array(m.sab)}boot().catch(x=>postMessage({t:'fail',s:String(x)}))}
if(m.t==='run'){try{const g=py.globals.get('dict')();g.set('__name__','__main__');await py.runPythonAsync(m.code,{globals:g});g.destroy();postMessage({t:'done'})}catch(x){postMessage({t:'done',err:String(x.message||x)})}}};`;
let wk,ready=false,running=false,pend=false,t0,fl,u8,sab=null;
const stat=(s,bad)=>{$('st').textContent=s;$('st').style.color=bad?'#f48771':''};
const add=(s,bad)=>{out.append(h('span',{className:bad?'e':'',textContent:s}));out.scrollTop=out.scrollHeight};
function ui(){$('run').style.display=running?'none':'';$('stop').style.display=running?'':'none'}
function engine(){ready=false;stat('Loading Python (first time is about 10 MB)');
 try{wk=new Worker(URL.createObjectURL(new Blob([WSRC],{type:'text/javascript'})))}catch(e){stat('Python engine is unavailable in this preview. Open the installed app.',1);return}
 if(self.crossOriginIsolated){sab=new SharedArrayBuffer(8192);fl=new Int32Array(sab);u8=new Uint8Array(sab)}else sab=fl=u8=null;
 wk.onmessage=e=>{const m=e.data;
  if(m.t==='ready'){ready=true;stat('Python ready');if(pend){pend=false;run()}}
  else if(m.t==='o')add(m.s);else if(m.t==='e')add(m.s,1);
  else if(m.t==='fail')stat('Engine failed to load: '+m.s,1);
  else if(m.t==='in'){dlg(m.p||'Your program asks for input','',v=>{v=v||'';const b=new TextEncoder().encode(v).slice(0,8000);u8.set(b,8);fl[1]=b.length;add(m.p+v+'\n');Atomics.store(fl,0,1);Atomics.notify(fl,0)},true)}
  else if(m.t==='done'){running=false;ui();
   if(m.err){let x=m.err;const i=x.indexOf('File "<exec>"');if(i>-1)x='Traceback (most recent call last):\n  '+x.slice(i);add(x.trim()+'\n',1);stat('Error',1)}
   else stat('Finished in '+((performance.now()-t0)/1000).toFixed(2)+' s')}};
 wk.onerror=e=>stat('Engine error: '+(e.message||'could not load'),1);
 wk.postMessage({t:'init',sab})}
function run(){if(running)return;ta.blur();
 if(!wk){stat('Python engine is unavailable in this preview. Open the installed app.',1);return}
 if(!ready){pend=true;stat('Loading Python, will run when ready');return}
 out.textContent='';running=true;ui();t0=performance.now();stat('Running\u2026');wk.postMessage({t:'run',code:ta.value})}
function stop(){if(!running)return;wk.terminate();running=false;add('\nStopped.\n',1);ui();engine();stat('Stopped, restarting Python\u2026',1)}
$('run').onclick=run;$('stop').onclick=stop;$('clr').onclick=()=>out.textContent='';
/* scripts sheet */
function sheet(...c){$('sheet').replaceChildren(...c);$('ov').classList.add('show')}
let inList=false,lock=false,arm=null,armT;
const closeS=()=>{inList=false;$('ov').classList.remove('show')};
$('ov').onclick=e=>{if(e.target.id==='ov'&&!lock)closeS()};
function dlg(title,def,ok,lk){lock=!!lk;inList=false;const i=h('input',{type:'text',value:def,autocomplete:'off',autocapitalize:'off',spellcheck:false});
 const done=v=>{lock=false;closeS();ok(v)};
 i.addEventListener('keydown',e=>{if(e.key==='Enter')done(i.value)});
 sheet(h('h2',{},title),i,h('div',{className:'row'},h('button',{textContent:'Cancel',onclick:()=>done(lk?'':null)}),h('button',{textContent:'OK',onclick:()=>done(i.value)})));setTimeout(()=>i.focus(),50)}
function newF(){const f=mk('script'+(S.files.length+1)+'.py');S.files.push(f);S.cur=f.id;load();save()}
function exp(){const a=h('a',{href:URL.createObjectURL(new Blob([ta.value],{type:'text/plain'})),download:cur().name});document.body.append(a);a.click();a.remove()}
function zoom(d){S.fs=Math.min(24,Math.max(10,S.fs+d));fs();paint();save()}
function files(){inList=true;sheet(h('h2',{},'Scripts'),...S.files.map(f=>h('div',{className:'row'},
 h('button',{className:'nm'+(f.id===S.cur?' on':''),textContent:f.name,onclick:()=>{S.cur=f.id;load();save();closeS()}}),
 h('button',{textContent:'Rename',onclick:()=>dlg('Rename script',f.name,v=>{if(v&&v.trim()){f.name=v.trim();save();load()}files()})}),
 h('button',{textContent:arm===f.id?'Tap again':'Delete',style:'color:#ff8a80',onclick:()=>{
  if(arm!==f.id){arm=f.id;clearTimeout(armT);armT=setTimeout(()=>{arm=null;if(inList)files()},3000);files();return}
  arm=null;S.files=S.files.filter(x=>x!==f);if(!S.files.length)S.files.push(mk('main.py'));if(S.cur===f.id)S.cur=S.files[0].id;save();load();files()}}))),
 h('p',{className:'cap'},'Tap a script to open it. Delete needs two taps.'),
 h('div',{className:'row'},h('button',{textContent:'+ New script',onclick:()=>{newF();closeS()}}),h('button',{textContent:'Import a .py file',onclick:()=>$('imp').click()})),
 h('div',{className:'row'},h('button',{textContent:'Save as .py file',onclick:exp}),h('button',{textContent:'Smaller text',onclick:()=>zoom(-1)}),h('button',{textContent:'Bigger text',onclick:()=>zoom(1)})),
 h('button',{textContent:'Close',style:'width:100%',onclick:closeS}))}
$('nm').onclick=files;
$('imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;const x=mk(f.name,await f.text());S.files.push(x);S.cur=x.id;load();save();closeS();e.target.value=''};
fs();load();engine();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
