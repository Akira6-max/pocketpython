/*ENDHL*/

  ...S.files.filter(f=>!f.folder).map(f=>row(f)),
  h('p',{className:'cap'},'Tap to open. Long press a script or folder for export, rename, move and delete.'),
  h('div',{className:'row'},h('button',{textContent:'+ New script',onclick:()=>{const f=mk('script'+(S.files.length+1)+'.py','',cur().folder);S.files.push(f);S.cur=f.id;load();save();closeS()}}),h('button',{textContent:'+ New folder',onclick:()=>dlg('New folder','',v=>{v=v&&v.trim();if(v&&!fnames().includes(v)){S.folders.push(v);S.open[v]=true;save()}files()})})),
  h('div',{className:'row'},h('button',{textContent:'Import files or .zip',onclick:()=>$('imp').click()})),
  h('button',{textContent:'Close',style:'width:100%',onclick:closeS}))}
function opts(f){scr='o'+f.id;sheet(h('h2',{},f.name),
 h('div',{className:'row'},h('button',{textContent:'Export as .py',onclick:()=>dl(new Blob([f.code],{type:'text/plain'}),safe(f.name))}),h('button',{textContent:'Export as .zip',onclick:()=>dl(zipOf([{path:safe(f.name),text:f.code}]),safe(f.name).replace(/\.py$/i,'')+'.zip')})),
 h('div',{className:'row'},h('button',{textContent:'Rename',onclick:()=>dlg('Rename script',f.name,v=>{if(v&&v.trim()){f.name=v.trim();save();load()}files()})}),h('button',{textContent:'Move to folder',onclick:()=>move(f)})),
 h('div',{className:'row'},two('o'+f.id,'Delete',()=>{S.files=S.files.filter(x=>x!==f);if(!S.files.length)S.files.push(mk('main.py'));save();load();files()},()=>opts(f)),h('button',{textContent:'Back',onclick:files})))}
function move(f){scr='m';sheet(h('h2',{},'Move '+f.name+' to'),...['',...fnames()].map(n=>h('button',{className:'nm mv'+(f.folder===n?' on':''),textContent:n||'No folder',onclick:()=>{f.folder=n;save();files()}})),
 h('button',{className:'mv',textContent:'+ New folder',onclick:()=>dlg('New folder','',v=>{v=v&&v.trim();if(v){if(!S.folders.includes(v))S.folders.push(v);f.folder=v;S.open[v]=true;save()}files()})}),h('button',{className:'mv',textContent:'Back',onclick:()=>opts(f)}))}
function fopts(n){scr='f'+n;sheet(h('h2',{},'Folder: '+n),
 h('div',{className:'row'},h('button',{textContent:'Export folder as .zip',onclick:()=>dl(zipOf(S.files.filter(f=>f.folder===n).map(f=>({path:safe(n)+'/'+safe(f.name),text:f.code}))),safe(n)+'.zip')})),
 h('div',{className:'row'},h('button',{textContent:'Rename',onclick:()=>dlg('Rename folder',n,v=>{v=v&&v.trim();if(v&&v!==n){S.files.forEach(f=>{if(f.folder===n)f.folder=v});S.folders=S.folders.map(x=>x===n?v:x);S.open[v]=S.open[n];delete S.open[n];save()}files()})}),two('f'+n,'Delete folder',()=>{S.files.forEach(f=>{if(f.folder===n)f.folder=''});S.folders=S.folders.filter(x=>x!==n);delete S.open[n];save();files()},()=>fopts(n))),
 h('p',{className:'cap'},'Deleting a folder keeps its scripts. They move to the main list.'),h('button',{textContent:'Back',style:'width:100%',onclick:files}))}
/* import */
function done(c){closeS();if(c){S.cur=S.files[S.files.length-1].id;load();save();stat('Imported '+c+' file'+(c>1?'s':''))}else stat('Nothing imported',1)}
function addZ(list){for(const z of list){const ps=z.path.split('/'),nm=ps.pop(),fo=ps[0]||'';if(fo&&!S.folders.includes(fo))S.folders.push(fo);S.files.push(mk(nm,z.text,fo))}done(list.length)}
function zipPick(en){scr='z';const sel=new Set(),ib=h('button',{textContent:'Import selected (0)',onclick:()=>addZ(en.filter((_,i)=>sel.has(i)))});
 const upd=()=>ib.textContent='Import selected ('+sel.size+')';
 const cbs=en.map((z,i)=>h('input',{type:'checkbox',onchange:e=>{e.target.checked?sel.add(i):sel.delete(i);upd()}}));
 sheet(h('h2',{},'Choose what to import'),...en.map((z,i)=>h('label',{className:'pk'},cbs[i],h('span',{},z.path))),
  h('div',{className:'row'},h('button',{textContent:'Select all',onclick:()=>{cbs.forEach((c,i)=>{c.checked=true;sel.add(i)});upd()}}),h('button',{textContent:'Clear',onclick:()=>{cbs.forEach(c=>c.checked=false);sel.clear();upd()}})),
  h('div',{className:'row'},h('button',{textContent:'Cancel',onclick:closeS}),ib))}
$('imp').onchange=async e=>{let c=0;const zs=[];for(const f of e.target.files){try{
 if(/\.zip$/i.test(f.name))for(const z of await unzip(await f.arrayBuffer())){const nm=z.path.split('/').pop();if(!/__MACOSX/.test(z.path)&&!nm.startsWith('.')&&/\.(py|txt)$/i.test(nm))zs.push(z)}
 else{S.files.push(mk(f.name,await f.text(),cur().folder));c++}}catch(x){}}
 e.target.value='';
 if(zs.length>1){if(c){S.cur=S.files[S.files.length-1].id;load();save()}zipPick(zs)}else if(zs.length===1)addZ(zs);else done(c)};
$('nm').onclick=files;
fs();load();engine();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
